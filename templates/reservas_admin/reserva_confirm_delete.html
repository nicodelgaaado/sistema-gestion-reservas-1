{% extends 'base.html' %}

{% block title %}Eliminar reserva{% endblock %}

{% block content %}
<section class="card form-card">
    <div class="card-heading">
        <span class="section-tag">Eliminar</span>
        <h2>Confirmar eliminacion</h2>
        <p>Esta accion quitara la reserva del laboratorio {{ object.laboratorio }} para la fecha {{ object.fecha }}.</p>
    </div>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <a class="btn btn-secondary" href="{% url 'reserva_lista' %}">Cancelar</a>
        <button type="submit" class="btn btn-danger">Eliminar</button>
    </form>
</section>
{% endblock %}
