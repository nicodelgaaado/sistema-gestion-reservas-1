services:
  - type: web
    name: sistema-gestion-reservas
    runtime: python
    plan: free
    region: virginia
    buildCommand: bash build.sh
    startCommand: python -m gunicorn gestion_reservas_admin.gestion_reservas_admin.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-gestion-reservas-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: sistema-gestion-reservas-db
    plan: free
    region: virginia
    databaseName: reservas
    user: reservas_user
